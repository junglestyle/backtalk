[project]
name = "backtalk"
version = "0.0.0"
description = "A realtime speech server for the house: it hears and transcribes speech on the GPU and reads replies aloud in Chimera's voice, over the OpenAI Realtime protocol"
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "onnx-asr>=0.12.0",
    # The same `onnxruntime` module either way: CUDA's build where the GPU host runs it, the CPU one on a Mac.
    "onnxruntime>=1.31.1 ; sys_platform != 'linux'",
    "onnxruntime-gpu>=1.31.1 ; sys_platform == 'linux'",
    "soxr>=1.1.0",
    "websockets>=17.4",
]

[project.scripts]
backtalk = "backtalk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = "==0.13.1"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with the formatter.
    "COM812", "ISC001",
    # Docstrings are prose, not Args/Returns sections, and not every function needs one.
    "D",
    # Messages are built where they're raised: raise SystemExit(f"...") is the house style.
    "EM", "TRY003",
    # CLIs print their results.
    "T20",
    # No TYPE_CHECKING import blocks; annotations import at the top like everything else.
    "TC",
    # Size and complexity are judged in review, not counted.
    "C90", "PLR0904", "PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917", "PLR1702",
    "PLR2004",
    # The formatter owns line length; a long comment or string isn't worth a finding.
    "E501",
    # Catching per item in a loop is how a run survives one bad item.
    "PERF203",
    # Heavy optional imports (torch, models) load inside the function that needs them.
    "PLC0415",
    # Modules may share a name with a stdlib module (queue.py) inside the package.
    "A005",
    # Untyped data enters as Any at the boundary (decoded JSON, driver rows).
    "ANN401",
    # A literal bool argument at the call site; FBT001/FBT002 still apply to definitions.
    "FBT003",
    # Commands are argv lists with shell=False; flagging every call adds noise, not safety.
    "S603", "S607",
    # No license headers or TODO formatting rules.
    "CPY", "FIX", "TD",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest asserts
    "ANN",     # tests aren't annotated or type-checked
    "ARG",     # fakes implement whole Protocols
    "SLF001",  # tests may reach into private helpers
    "INP001",  # tests/ isn't a package
]
"tools/**" = [
    "INP001",  # tools/ holds scripts run by path, not a package
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Use a small fake that satisfies the Protocol, or monkeypatch."
"unittest.TestCase".msg = "Write plain pytest functions."

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Neither ships type information; their calls are wrapped in typed functions in audio.py and models.py.
module = ["soxr", "onnxruntime"]
ignore_missing_imports = true
